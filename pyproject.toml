[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true

[project]
name = "blaise_restapi"
version = "0.1.0"
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests (>=2.34.2,<2.35.0)",
    "urllib3 (>=2.8.0,<2.9.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<9.2.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "responses (>=0.26.3,<0.27.0)",
    "pyright (>=1.1.414,<1.2.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "vulture (>=2.16,<3.0)",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "C90", "SIM", "RUF", "Q"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"] # Ignores argument limit of 5 for test files (requires 6)

[tool.pyright]
include = ["blaise_restapi", "tests"]
typeCheckingMode = "strict"

[tool.vulture]
min_confidence = 70

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"
pythonpath = ["blaise_restapi"]

[tool.coverage.report]
omit = ["tests/*"]